<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1200, initial-scale=1"/>
<title>Composite — Card Decks (4 backs)</title>
<!--
  Final aspect: 4:5 → 1200×1500
  Output file: docs/legal/site/images/customize/v2-decks-row.webp

  Composition: 4 card BACKS (not Fool full-cards — backs are abstract
  art, Fools are Major Arcana imagery and reinforce tarot framing).
  Slight overlap with mild perspective, like a hand of cards spread
  in a fan. Dark void background. Bottom ~1/3 reserved for the CSS
  gradient overlay added by index.html.

  Source assets (4 user-selected card backs in card_backs/ folder):
    docs/legal/site/images/customize/card_backs/back-gotic.jpg     (Gothic Hand)
    docs/legal/site/images/customize/card_backs/back-cat.jpg       (Black Cat)
    docs/legal/site/images/customize/card_backs/eclipse-ruin.jpg   (Eclipse Ruin)
    docs/legal/site/images/customize/card_backs/red-eclipse.jpg    (Red Eclipse)

  These 4 happen to read as a strong set — gothic flora / cat under
  moon / burning eclipse / red eclipse corona — visually distinct
  art styles, no two looking similar at thumbnail size.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 1500px; overflow: hidden;
    background: #0A0A0F;
    font-family: 'Georgia', serif;
  }
  /* Starfield bg — same treatment as themes-flat-lay.html so the
     three composites read as one universe. See that file for the
     full rationale on opacity / blend mode / vignette layering. */
  .starfield {
    position: absolute; inset: 0;
    background-image: url('../images/hero-background.webp');
    background-size: cover;
    background-position: center;
    opacity: 1;
    mix-blend-mode: screen;
  }
  .starfield-overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 0%, rgba(10, 10, 15, 0.1) 60%, rgba(10, 10, 15, 0.85) 100%),
      linear-gradient(to bottom, transparent 0%, transparent 60%, rgba(10, 10, 15, 0.7) 100%);
    pointer-events: none;
  }
  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    perspective: 1400px;
    z-index: 2;
  }
  /* Card aspect ratio — same as in-app (2.75:4.75 ≈ 0.579) */
  .card {
    position: absolute;
    width: 380px;
    aspect-ratio: 0.579;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.55),
      0 0 30px rgba(196, 125, 90, 0.08),
      inset 0 0 0 2px rgba(196, 125, 90, 0.12);
    transform-style: preserve-3d;
  }
  .card img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .card img.broken {
    background: repeating-linear-gradient(
      45deg, rgba(196,125,90,0.12), rgba(196,125,90,0.12) 12px,
      transparent 12px, transparent 24px
    );
    color: rgba(240,237,229,0.7);
    text-align: center;
    padding-top: 50%;
    font-size: 16px;
    letter-spacing: 1px;
  }
  /* Fan layout: 4 cards with mild rotation and horizontal stagger.
     Centre cards lift slightly to add depth. */
  .c-1 { transform: translate(-540px, 20px)  rotate(-12deg) rotateY(8deg);   z-index: 1; }
  .c-2 { transform: translate(-180px, -30px) rotate(-4deg)  rotateY(3deg);   z-index: 2; }
  .c-3 { transform: translate(180px, -30px)  rotate(4deg)   rotateY(-3deg);  z-index: 3; }
  .c-4 { transform: translate(540px, 20px)   rotate(12deg)  rotateY(-8deg);  z-index: 4; }
  /* Optional faint copper glow behind the fan */
  .glow {
    position: absolute;
    width: 900px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(196,125,90,0.10) 0%, transparent 70%);
    filter: blur(40px);
    z-index: 0;
  }
  /* Bottom-vignette so the CSS gradient overlay on the site looks
     intentional rather than a hard edge. */
  .vignette {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 0%, transparent 65%,
      rgba(10, 10, 15, 0.55) 100%
    );
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="starfield"></div>
<div class="starfield-overlay"></div>
<div class="stage">
  <div class="glow"></div>
  <div class="card c-1">
    <img src="../images/customize/card_backs/back-gotic.jpg"
         alt="Gothic Hand card back"
         onerror="this.classList.add('broken'); this.alt='[ missing: back-gotic.jpg ]';"/>
  </div>
  <div class="card c-2">
    <img src="../images/customize/card_backs/back-cat.jpg"
         alt="Black Cat card back"
         onerror="this.classList.add('broken'); this.alt='[ missing: back-cat.jpg ]';"/>
  </div>
  <div class="card c-3">
    <img src="../images/customize/card_backs/eclipse-ruin.jpg"
         alt="Eclipse Ruin card back"
         onerror="this.classList.add('broken'); this.alt='[ missing: eclipse-ruin.jpg ]';"/>
  </div>
  <div class="card c-4">
    <img src="../images/customize/card_backs/red-eclipse.jpg"
         alt="Red Eclipse card back"
         onerror="this.classList.add('broken'); this.alt='[ missing: red-eclipse.jpg ]';"/>
  </div>
  <div class="vignette"></div>
</div>
</body>
</html>
